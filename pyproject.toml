[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afdps-pde"
version = "0.1.0"
description = "Research implementation of approximation-free diffusion posterior sampling"
authors = [
    { name = "Jonathan Ma", email = "johnma@udel.edu" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.9,<1", "build>=1,<2", "pillow>=10,<13"]
train = ["pillow>=10,<13"]

[project.scripts]
train-edm = "train_edm.__main__:main"

[tool.setuptools]
package-dir = {"" = "src", "train_edm" = "train-edm/train_edm"}

[tool.setuptools.packages.find]
where = ["src", "train-edm"]
include = ["afdps*", "train_edm*"]
namespaces = false

[tool.setuptools.package-data]
afdps = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "train-edm/tests"]
pythonpath = ["src", "train-edm"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
